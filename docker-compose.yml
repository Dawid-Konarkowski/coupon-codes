services:
  db:
    image: postgres:16-alpine
    container_name: coupons-db
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: coupons
    ports:
      - "5432:5432"
    volumes:
      - coupons-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupons -d coupons"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coupons-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coupons
      SPRING_DATASOURCE_USERNAME: coupons
      SPRING_DATASOURCE_PASSWORD: coupons
      SERVER_PORT: "8080"
      # Non-public client IPs (as seen inside Docker) cannot be geolocated; default them to PL so
      # the country rule is testable out of the box. Override or clear as needed.
      COUPONS_GEO_DEFAULT_COUNTRY: PL
      COUPONS_GEO_ALLOW_COUNTRY_HEADER: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  coupons-db-data:
